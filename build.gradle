plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = "${mod_version}+${minecraft_version}-Fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
}

loom {
}

fabricApi {
}

dependencies {
	implementation 'org.apache.commons:commons-text:1.12.0'
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-1.21.4:${project.parchment_date}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fapi_version}"

	// MStV+ Villager Trades
	modCompileOnly "maven.modrinth:more-weapon-variants:${project.mweaponv_version_id}"
	modCompileOnly "maven.modrinth:more-tool-variants:${project.mtoolv_version_id}"
	modCompileOnly "maven.modrinth:more-frame-variants:${project.mframev_version_id}"
	modCompileOnly "maven.modrinth:more-fishing-rod-variants:${project.mfrodv_version_id}"
		// Nemo's Campfires
		modCompileOnly "maven.modrinth:nemos-campfires:${project.nemoscampfirev_version_id}"
		// More Fletching Tables
		modCompileOnly "maven.modrinth:more-fletching-tables:${project.mfletchingtablev_version_id}"
		// More Shield Variants
		modCompileOnly "maven.modrinth:more-shield-variants:${project.mshieldv_version_id}"
		// More Bed Variants
		modCompileOnly "maven.modrinth:more-bed-variants:${project.mbedv_version_id}"
		// More Bookshelf Variants
		modCompileOnly "maven.modrinth:more-bookshelf-variants-lieonlion:${project.mbookshelfv_version_id}"

	// MStV+ Villager Trades (Testing)
	/**/
	//modRuntimeOnly "maven.modrinth:more-weapon-variants:${project.mweaponv_version_id}"
	//modRuntimeOnly "maven.modrinth:more-tool-variants:${project.mtoolv_version_id}"
	//modRuntimeOnly "maven.modrinth:more-frame-variants:${project.mframev_version_id}"
	modRuntimeOnly "maven.modrinth:more-fishing-rod-variants:${project.mfrodv_version_id}"
		// nemosCampfireV
		modRuntimeOnly "maven.modrinth:nemos-campfires:${project.nemoscampfirev_version_id}"
		// More Fletching Tables
		modRuntimeOnly "maven.modrinth:more-fletching-tables:${project.mfletchingtablev_version_id}"
		// More Shield Variants
		//modRuntimeOnly "maven.modrinth:more-shield-variants:${project.mshieldv_version_id}"
		// More Bed Variants
		//modRuntimeOnly "maven.modrinth:more-bed-variants:${project.mbedv_version_id}"
		// More Bookshelf Variants
		//modRuntimeOnly "maven.modrinth:more-bookshelf-variants-lieonlion:${project.mbookshelfv_version_id}"
		//modRuntimeOnly "maven.modrinth:quad:${project.quad_version_id}"
	/**/
}

processResources {
	var replaceProperties = [
			loader_version: loader_version, mod_id: mod_id, mod_name: mod_name,
			mod_license: mod_license, mod_version: mod_version,
			mod_description: mod_description, minecraft_version: minecraft_version
	]
	inputs.properties replaceProperties

	filesMatching("fabric.mod.json") {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}