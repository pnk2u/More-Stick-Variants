buildscript {
    repositories {maven {url = 'https://maven.fabricmc.net/'}}
    apply from: "versions.gradle"
    def (loomGroupId, loomArtifactId, loomVersion, loomBaseId) = getFabricLoom(project.minecraft_version)
    def minecraftRelease = getMinecraftReleaseVersion(minecraft_version)
    def (fabricLoaderVersion, minFabricLoaderVersion, fabricApiVersion) = getLatestFabricVersions(minecraftRelease)
    def (parchmentMcVersion, parchmentDate) = getLatestParchmentVersions(minecraftRelease)
    def (minMinecraftVersionExcl, maxMinecraftVersionExcl) = getMinecraftVersionExclRange(minecraft_version_min_excl, minecraft_version_max_excl)
    def (javaVersionNum, javaVersionEnum) = getJavaVersions(minecraftRelease)
    dependencies {
        classpath "$loomGroupId:$loomArtifactId:$loomVersion"
    }
    ext {
        ext.loomPluginBaseId = loomBaseId
        ext.minecraftRelease = minecraftRelease
        ext.fabricLoaderVersion = fabricLoaderVersion
        ext.minFabricLoaderVersion = minFabricLoaderVersion
        ext.fabricApiVersion = fabricApiVersion
        ext.parchmentMcVersion = parchmentMcVersion
        ext.parchmentDate = parchmentDate
        ext.minMinecraftVersionExcl = minMinecraftVersionExcl
        ext.maxMinecraftVersionExcl = maxMinecraftVersionExcl
        ext.javaVersionNum = javaVersionNum
        ext.javaVersionEnum = javaVersionEnum
    }
}
plugins {
    id 'dev.isxander.mtk.modrepos'
}

apply plugin: "${loomPluginBaseId}"
apply from: "versions.gradle"
apply plugin: "dev.isxander.mtk.modrepos"

def getMinecraftVersionName(){
    String key = 'minecraft_version_name'
    if (project.hasProperty(key)) {String value = project.getProperties().get(key); return !value.isEmpty() ? value : project.minecraft_version}
    else {return project.minecraft_version}
}
version = "${mod_version}+${getMinecraftVersionName()}-Fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
    parchment()
    modrinthApi.exclusive()
}

loom {
    mixin {
        useLegacyMixinAp = true
    }
    accessWidenerPath = file("src/main/resources/mstv-base.accesswidener")
    log4jConfigs.from(file("log4j.xml"))
}

dependencies {
    implementation 'org.apache.commons:commons-text:1.12.0'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchmentMcVersion}:${parchmentDate}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

	// MStV+ Villager Trades
	modCompileOnly "maven.modrinth:more-weapon-variants:${project.m_weapon_v_version_id}"
	modCompileOnly "maven.modrinth:more-tool-variants:${project.m_tool_v_version_id}"
	modCompileOnly "maven.modrinth:more-frame-variants:${project.m_frame_v_version_id}"
	modCompileOnly "maven.modrinth:more-fishing-rod-variants:${project.m_fishing_rod_v_version_id}"
		// Nemo's Campfires
		modCompileOnly "maven.modrinth:nemos-campfires:${project.nemos_campfires_version_id}"
		// More Fletching Tables
		modCompileOnly "maven.modrinth:more-fletching-tables:${project.m_fletching_t_version_id}"
		// More Shield Variants
		modCompileOnly "maven.modrinth:more-shield-variants:${project.m_shield_v_version_id}"
			// More Extra Shield Variants
			modCompileOnly "maven.modrinth:more-extra-shield-variants:${project.m_extra_shield_v_version_id}"
		// More Bed Variants
		modCompileOnly "maven.modrinth:more-bed-variants:${project.m_bed_v_version_id}"
		// More Bookshelf Variants
		modCompileOnly "maven.modrinth:more-bookshelf-variants-lieonlion:${project.m_bookshelf_v_lol_version_id}"

	// MStV+ Villager Trades (Testing)
	/**/
	modLocalRuntime "maven.modrinth:more-weapon-variants:${project.m_weapon_v_version_id}"
	modLocalRuntime "maven.modrinth:more-tool-variants:${project.m_tool_v_version_id}"
	modLocalRuntime "maven.modrinth:more-frame-variants:${project.m_frame_v_version_id}"
	modLocalRuntime "maven.modrinth:more-fishing-rod-variants:${project.m_fishing_rod_v_version_id}"
		// nemosCampfireV
		modLocalRuntime "maven.modrinth:nemos-campfires:${project.nemos_campfires_version_id}"
		// More Fletching Tables
		modLocalRuntime "maven.modrinth:more-fletching-tables:${project.m_fletching_t_version_id}"
		// More Shield Variants
		modLocalRuntime "maven.modrinth:more-shield-variants:${project.m_shield_v_version_id}"
		// More Bed Variants
		modLocalRuntime "maven.modrinth:more-bed-variants:${project.m_bed_v_version_id}"
		// More Bookshelf Variants
		modLocalRuntime "maven.modrinth:more-bookshelf-variants-lieonlion:${project.m_bookshelf_v_lol_version_id}"
		modLocalRuntime "maven.modrinth:quad:${project.quad_version_id}"
	/**/
}

def replaceProperties = [
        mod_id: mod_id, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license,
        mod_version: mod_version,
        minFabricLoaderVersion: minFabricLoaderVersion,
        minMinecraftVersionExcl: minMinecraftVersionExcl, maxMinecraftVersionExcl: maxMinecraftVersionExcl, javaVersion: javaVersionNum
]
println "===\nExpanding the following values into fabric.mod.json and *.mixins.json:\n${replaceProperties.collect { k, v -> "  ${k}: ${v}" }.join('\n')}\n==="

processResources {

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }
    filesMatching("*.mixins.json") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersionNum
}

java {
    sourceCompatibility = javaVersionEnum
    targetCompatibility = javaVersionEnum
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}